apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finn-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://betterbag.com"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - betterbag.com
    - www.betterbag.com
    - api.betterbag.com
    secretName: finn-tls-cert
  rules:
  - host: betterbag.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finn-frontend-service
            port:
              number: 80
  - host: www.betterbag.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finn-frontend-service
            port:
              number: 80
  - host: api.betterbag.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finn-backend-service
            port:
              number: 80

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: support@betterbag.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finn-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: finn-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: default
    - podSelector:
        matchLabels:
          app: finn-frontend
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 443
