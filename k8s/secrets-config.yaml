apiVersion: v1
kind: Secret
metadata:
  name: finn-secrets
  namespace: default
type: Opaque
stringData:
  database-url: "postgresql://finn_user:PASSWORD@postgres.default.svc.cluster.local:5432/finn_db"
  redis-url: "redis://redis.default.svc.cluster.local:6379"
  jwt-secret: "CHANGE_THIS_TO_SECURE_SECRET_IN_PRODUCTION"
  supabase-url: "SUPABASE_URL_HERE"
  supabase-key: "SUPABASE_KEY_HERE"
  claude-api-key: "CLAUDE_API_KEY_HERE"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finn-config
  namespace: default
data:
  APP_NAME: "Finn AI CEO"
  APP_VERSION: "3.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  CACHE_TTL: "300"
  SESSION_TIMEOUT: "3600"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION: "1800"
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: default
type: kubernetes.io/dockercfg
data:
  .dockercfg: eyJhdXRocyI6IHsgImhvY3N0IjogeyJhdXRoIjogImJhc2U2NF9lbmNvZGVkX2NyZWRlbnRpYWxzIn19fQ==

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finn-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finn-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: finn-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: finn-role
subjects:
- kind: ServiceAccount
  name: finn-sa
  namespace: default

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: do-block-storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: do-block-storage
